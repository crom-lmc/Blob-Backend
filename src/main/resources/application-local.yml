# 本地（测试）环境：--spring.profiles.active=local（application.yml 中已默认激活）
#
# 本环境配置全部从 Nacos 的「blog-local」命名空间拉取 blog-server.yaml，
# 数据源 / Redis / jwt / upload / site 均不在本文件硬编码。
#
# 重要前提（否则启动会卡死在 Nacos gRPC 重试）：
#   Nacos 2.x 客户端走 gRPC，端口 = server-addr 端口 + 1000。
#   本机通过 MobaXterm 隧道访问远端 Nacos 时，除 HTTP(18848) 外，还必须在 MobaXterm
#   给同一会话加一条本地端口转发：  19848 → 远端 127.0.0.1:9848
#   验证：Test-NetConnection 127.0.0.1 19848  应返回 True。
#   若不想用隧道，可直接把 NACOS_SERVER_ADDR 设为远端 Nacos 公网地址:8848
#   （前提是远端 9848 也对外开放）。
#
# 另：NACOS_SERVER_ADDR / NACOS_USERNAME / NACOS_PASSWORD / NACOS_GROUP 取自系统环境变量，
#     IDEA 需重启以继承（File → Exit 后重开项目），否则会报占位符无法解析。

spring:
  config:
    import:
      - nacos:blog-server.yaml
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR}
      username: ${NACOS_USERNAME}
      # 必填：取自系统环境变量（Windows 用户级已配置），空密码会被 Nacos 判 403
      password: ${NACOS_PASSWORD}
      config:
        # blog-local 命名空间 ID
        namespace: d67bc8e4-93ba-43ff-b1d1-adc0b9197665
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        file-extension: yaml
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}
        refresh-enabled: true
