# 线上（生产）环境：--spring.profiles.active=prod
#
# 从 Nacos 的 「blob-prod」 命名空间拉取 blob-server.yaml，
# 该命名空间里的配置指向云服务器：MySQL 120.53.9.119:3306/blob、Redis 120.53.9.119:6379。
#
# 启动：
#   export NACOS_PASSWORD=你的Nacos密码
#   java -jar blob-backend.jar --spring.profiles.active=prod
#
# 说明：命名空间在客户端用「ID」而不是名称。
#   blob-prod 的 ID = c0ebc191-0458-4229-a3d7-f92e151832a3
# dataId 必须与 Nacos 中一致：blob-server.yaml
#   （dataId 是 Nacos 端文件名，与模块名解耦；改名需先在 Nacos 中同步，否则启动时拉不到配置）

spring:
  config:
    import:
      - nacos:blob-server.yaml
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR}
      username: ${NACOS_USERNAME}
      # 必填：未设置时启动即报 "Could not resolve placeholder 'NACOS_PASSWORD'"
      password: ${NACOS_PASSWORD}
      config:
        # blob-prod 命名空间 ID
        namespace: c0ebc191-0458-4229-a3d7-f92e151832a3
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        file-extension: yaml
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}
        refresh-enabled: true
