services:
  blog-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: blog-server:latest
    container_name: blog-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      NACOS_SERVER_ADDR: ${NACOS_SERVER_ADDR}
      NACOS_USERNAME: ${NACOS_USERNAME}
      NACOS_PASSWORD: ${NACOS_PASSWORD}
      NACOS_GROUP: ${NACOS_GROUP:-DEFAULT_GROUP}
      JAVA_OPTS: "-Xms256m -Xmx512m -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError -Duser.timezone=Asia/Shanghai -Djava.security.egd=file:/dev/./urandom"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - blob-network
    mem_limit: 768m
    volumes:
      - /data/blob/uploads:/app/uploads
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

networks:
  blob-network:
    external: true
