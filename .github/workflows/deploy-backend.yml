# Blob-Backend CI/CD —— 新机(81.70.80.209)版
# 改动：去掉内联 NACOS_SERVER_ADDR，改由各机器 compose 自行提供
#       （新机 compose 用 nacos:8848 容器名互访；旧机 compose 用 120.53.9.119:8848）
# 仓库 Secrets：SERVER_HOST = 81.70.80.209 ，SSH_KEY = deploy 私钥全文
name: Deploy Backend

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH 到服务器部署
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd /opt/Blob-Backend-main
            git pull --ff-only
            # 构建期间先停掉旧容器，腾出 ~512MB 内存，避免 2G 小机 OOM
            docker compose stop blog-server
            docker compose up -d --build blog-server
            # 清理悬空镜像，省磁盘
            docker image prune -f
