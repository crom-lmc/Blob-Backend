# Blob-Backend CI/CD —— 基础设施已入库，直接拉取重建即可（无需 stash 兜底）
# 用法：本文件放到 Blob-Backend 仓库的  .github/workflows/deploy.yml
# 仓库 Secrets 需配置：SERVER_HOST = 120.53.9.119 ，SSH_KEY = deploy 私钥全文
name: Deploy Backend

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH 到服务器部署
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd /opt/Blob-Backend-main
            git pull --ff-only
            # 构建期间先停掉旧容器，腾出 ~512MB 内存，避免 2G 小机 OOM
            docker compose stop blog-server
            NACOS_SERVER_ADDR=120.53.9.119:8848 docker compose up -d --build blog-server
            # 清理悬空镜像，省磁盘
            docker image prune -f
