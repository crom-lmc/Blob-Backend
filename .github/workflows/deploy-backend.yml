name: Deploy Backend

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH 到服务器部署
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd /opt/Blob-Backend-main
            git pull --ff-only
            # 构建期间先停掉旧容器，腾出 ~512MB 内存，避免 2G 小机 OOM
            docker compose stop blob-backend
            docker compose up -d --build blob-backend
            # 清理悬空镜像，省磁盘
            docker image prune -f
