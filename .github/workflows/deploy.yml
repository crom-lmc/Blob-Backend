name: Deploy Backend

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH 到服务器部署
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd /opt/Blob-Backend-main
            git stash
            git pull --ff-only
            git stash pop
            docker compose stop blog-server
            NACOS_SERVER_ADDR=120.53.9.119:8848 docker compose up -d --build blog-server
            docker image prune -f
